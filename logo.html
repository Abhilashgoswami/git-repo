```
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #f2f2f2;
        font-family: Arial, sans-serif;
    }

    .logo {
        font-size: 70px;
        font-weight: bold;
        letter-spacing: 5px;
        color: #222;
        text-transform: uppercase;
        position: relative;
    }

    .logo::after {
        content: "";
        position: absolute;
        left: 0;
        bottom: -15px;
        width: 100%;
        height: 5px;
        background: #007bff;
        border-radius: 10px;
    }

    .logo span {
        color: #007bff;
    }
</style>
```

</head>

<body>

```
<div class="logo">
    <span>A</span>BHILASH
</div>
```

</body>
